<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <rect x="2" y="2" width="196" height="216" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Ears -->
  <circle cx="65" cy="48" r="18" fill="white" stroke="black" stroke-width="2.5"/>
  <circle cx="135" cy="48" r="18" fill="white" stroke="black" stroke-width="2.5"/>
  <circle cx="65" cy="51" r="9" fill="black" opacity="0.18"/>
  <circle cx="135" cy="51" r="9" fill="black" opacity="0.18"/>

  <!-- Head -->
  <circle cx="100" cy="78" r="42" fill="white" stroke="black" stroke-width="2.5"/>

  <!-- Snout -->
  <ellipse cx="100" cy="93" rx="22" ry="14" fill="white" stroke="black" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="83" cy="71" r="3.8" fill="black"/>
  <circle cx="117" cy="71" r="3.8" fill="black"/>

  <!-- Nose -->
  <ellipse cx="100" cy="86" rx="6.5" ry="4.5" fill="black"/>

  <!-- Mouth -->
  <path d="M 100 92 L 100 100" fill="none" stroke="black" stroke-width="1.8"/>
  <path d="M 100 100 Q 92 104 87 99" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 100 100 Q 108 104 113 99" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M 60 122 L 60 182 Q 60 198 76 198 L 124 198 Q 140 198 140 182 L 140 122 Z"
        fill="white" stroke="black" stroke-width="2.5"/>

  <!-- Vest (solid pattern — Bea's distinguishing fill) -->
  <path d="M 70 128 L 65 142 L 65 182 Q 65 192 76 192 L 124 192 Q 135 192 135 182 L 135 142 L 130 128 L 116 134 L 100 137 L 84 134 Z"
        fill="black" stroke="black" stroke-width="2"/>

  <!-- White neckline triangle -->
  <path d="M 100 137 L 95 150 L 105 150 Z" fill="white"/>

  <!-- Name -->
  <text x="100" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Bea</text>
</svg>
