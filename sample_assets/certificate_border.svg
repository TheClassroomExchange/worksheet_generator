<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <!-- Outer thin line -->
  <rect x="30" y="30" width="790" height="1040" fill="none" stroke="black" stroke-width="1.5"/>
  <!-- Inner decorative line -->
  <rect x="42" y="42" width="766" height="1016" fill="none" stroke="black" stroke-width="3"/>
  <!-- Innermost thin line -->
  <rect x="50" y="50" width="750" height="1000" fill="none" stroke="black" stroke-width="1"/>

  <!-- Corner ornaments (4 corners) -->
  <g fill="none" stroke="black" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top-left corner -->
    <g transform="translate(50, 50)">
      <path d="M 0 30 Q 15 15 30 0 Q 35 8 28 18 Q 18 28 8 28 Q 4 30 0 30 Z" fill="white"/>
      <circle cx="18" cy="18" r="2.5" fill="black"/>
      <path d="M 30 0 Q 50 5 60 18"/>
      <path d="M 0 30 Q 5 50 18 60"/>
    </g>
    <!-- Top-right corner -->
    <g transform="translate(800, 50) scale(-1, 1)">
      <path d="M 0 30 Q 15 15 30 0 Q 35 8 28 18 Q 18 28 8 28 Q 4 30 0 30 Z" fill="white"/>
      <circle cx="18" cy="18" r="2.5" fill="black"/>
      <path d="M 30 0 Q 50 5 60 18"/>
      <path d="M 0 30 Q 5 50 18 60"/>
    </g>
    <!-- Bottom-left corner -->
    <g transform="translate(50, 1050) scale(1, -1)">
      <path d="M 0 30 Q 15 15 30 0 Q 35 8 28 18 Q 18 28 8 28 Q 4 30 0 30 Z" fill="white"/>
      <circle cx="18" cy="18" r="2.5" fill="black"/>
      <path d="M 30 0 Q 50 5 60 18"/>
      <path d="M 0 30 Q 5 50 18 60"/>
    </g>
    <!-- Bottom-right corner -->
    <g transform="translate(800, 1050) scale(-1, -1)">
      <path d="M 0 30 Q 15 15 30 0 Q 35 8 28 18 Q 18 28 8 28 Q 4 30 0 30 Z" fill="white"/>
      <circle cx="18" cy="18" r="2.5" fill="black"/>
      <path d="M 30 0 Q 50 5 60 18"/>
      <path d="M 0 30 Q 5 50 18 60"/>
    </g>
  </g>

  <!-- Star motifs along top/bottom -->
  <g fill="white" stroke="black" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="425,46 429,57 440,57 432,64 435,75 425,68 415,75 418,64 410,57 421,57"/>
    <polygon points="425,1054 429,1043 440,1043 432,1036 435,1025 425,1032 415,1025 418,1036 410,1043 421,1043"/>
  </g>
</svg>
