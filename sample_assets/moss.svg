<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <rect x="2" y="2" width="196" height="216" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Antlers (signature moose feature) -->
  <path d="M 70 28 L 70 50 M 70 35 L 60 32 M 70 38 L 60 42 M 70 45 L 58 50" stroke="black" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 130 28 L 130 50 M 130 35 L 140 32 M 130 38 L 140 42 M 130 45 L 142 50" stroke="black" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Ears (sit beside antlers) -->
  <ellipse cx="78" cy="58" rx="8" ry="12" fill="white" stroke="black" stroke-width="2.5" transform="rotate(-20 78 58)"/>
  <ellipse cx="122" cy="58" rx="8" ry="12" fill="white" stroke="black" stroke-width="2.5" transform="rotate(20 122 58)"/>

  <!-- Head (oval, longer than bear/fox) -->
  <ellipse cx="100" cy="80" rx="38" ry="42" fill="white" stroke="black" stroke-width="2.5"/>

  <!-- Long snout -->
  <ellipse cx="100" cy="105" rx="22" ry="16" fill="white" stroke="black" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="85" cy="74" r="3.5" fill="black"/>
  <circle cx="115" cy="74" r="3.5" fill="black"/>

  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="6" ry="4" fill="black"/>

  <!-- Mouth -->
  <path d="M 100 110 Q 100 115 100 118" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 100 118 Q 92 121 88 117" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 100 118 Q 108 121 112 117" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M 60 130 L 60 184 Q 60 198 76 198 L 124 198 Q 140 198 140 184 L 140 130 Z"
        fill="white" stroke="black" stroke-width="2.5"/>

  <!-- Vest base -->
  <path d="M 70 136 L 65 148 L 65 184 Q 65 192 76 192 L 124 192 Q 135 192 135 184 L 135 148 L 130 136 L 116 142 L 100 145 L 84 142 Z"
        fill="white" stroke="black" stroke-width="2"/>

  <!-- Vest checkered pattern (Moss's distinguishing fill) -->
  <g fill="black">
    <rect x="68" y="148" width="11" height="11"/>
    <rect x="90" y="148" width="11" height="11"/>
    <rect x="112" y="148" width="11" height="11"/>
    <rect x="79" y="159" width="11" height="11"/>
    <rect x="101" y="159" width="11" height="11"/>
    <rect x="123" y="159" width="11" height="11"/>
    <rect x="68" y="170" width="11" height="11"/>
    <rect x="90" y="170" width="11" height="11"/>
    <rect x="112" y="170" width="11" height="11"/>
    <rect x="79" y="181" width="11" height="9"/>
    <rect x="101" y="181" width="11" height="9"/>
    <rect x="123" y="181" width="11" height="9"/>
  </g>

  <!-- Name -->
  <text x="100" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Moss</text>
</svg>
