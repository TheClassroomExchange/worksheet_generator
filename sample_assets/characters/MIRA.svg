<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mayor's bicorn hat -->
  <path d="M 188 110 Q 196 70 256 64 Q 316 70 324 110 Q 290 122 256 122 Q 222 122 188 110 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hat ribbon band -->
  <path d="M 200 108 Q 256 118 312 108"
        fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Hat star/cockade -->
  <circle cx="256" cy="92" r="6" fill="white" stroke="black" stroke-width="2"/>
  <path d="M 256 84 L 258 90 L 264 90 L 259 94 L 261 100 L 256 96 L 251 100 L 253 94 L 248 90 L 254 90 Z"
        fill="black"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Mayor sash diagonal across chest -->
  <path d="M 168 350 L 348 380"
        fill="none" stroke="black" stroke-width="3"/>
  <path d="M 172 365 L 352 395"
        fill="none" stroke="black" stroke-width="3"/>
  <!-- Medallion on sash -->
  <circle cx="320" cy="386" r="10"
          fill="white" stroke="black" stroke-width="2.5"/>
  <circle cx="320" cy="386" r="3" fill="black"/>

  <!-- Tiny stubby arms -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Confident smile -->
  <path d="M 234 312 Q 256 332 278 312"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Cute oval blush -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>

  <!-- Signature: unrolled scroll/decree across body with squiggle text -->
  <circle cx="196" cy="420" r="10"
          fill="white" stroke="black" stroke-width="3"/>
  <circle cx="316" cy="420" r="10"
          fill="white" stroke="black" stroke-width="3"/>
  <rect x="196" y="408" width="120" height="24" rx="2"
        fill="white" stroke="black" stroke-width="3"/>
  <!-- Squiggle text lines -->
  <path d="M 208 416 Q 214 414 220 416 Q 226 418 232 416 Q 238 414 244 416 Q 250 418 256 416 Q 262 414 268 416 Q 274 418 280 416 Q 286 414 292 416 Q 298 418 304 416"
        fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 208 425 Q 214 423 220 425 Q 226 427 232 425 Q 238 423 244 425 Q 250 427 256 425 Q 262 423 268 425 Q 274 427 280 425 Q 286 423 292 425 Q 298 427 304 425"
        fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
