<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Triangular cat ears -->
  <path d="M 184 128 L 196 80 L 224 122 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 328 128 L 316 80 L 288 122 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner ear lines -->
  <path d="M 196 92 L 208 118" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 316 92 L 304 118" fill="none" stroke="black" stroke-width="2"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tail curving along right side -->
  <path d="M 410 340 Q 450 360 446 410 Q 442 446 412 444"
        fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny stubby arms -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Tiny triangular cat nose + grin -->
  <path d="M 250 302 L 262 302 L 256 310 Z" fill="black"/>
  <path d="M 240 318 Q 256 330 272 318"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Whiskers on cheeks -->
  <line x1="172" y1="298" x2="128" y2="290" stroke="black" stroke-width="2"/>
  <line x1="172" y1="306" x2="128" y2="308" stroke="black" stroke-width="2"/>
  <line x1="340" y1="298" x2="384" y2="290" stroke="black" stroke-width="2"/>
  <line x1="340" y1="306" x2="384" y2="308" stroke="black" stroke-width="2"/>

  <!-- Blush ovals with hatch lines -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>

  <!-- Signature: tally bundle of 5 (4 verticals + 1 diagonal) -->
  <line x1="222" y1="400" x2="222" y2="450" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="238" y1="400" x2="238" y2="450" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="254" y1="400" x2="254" y2="450" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="270" y1="400" x2="270" y2="450" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <line x1="214" y1="450" x2="278" y2="400" stroke="black" stroke-width="4" stroke-linecap="round"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
