<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Chef's toque: puffy hat with band -->
  <!-- Hat band -->
  <rect x="208" y="110" width="96" height="14" rx="2"
        fill="white" stroke="black" stroke-width="4"/>
  <!-- Puffy top of toque -->
  <path d="M 212 110 Q 200 80 220 70 Q 232 50 256 62 Q 280 50 292 70 Q 312 80 300 110 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <!-- Subtle puff lines -->
  <path d="M 230 84 Q 234 92 230 100" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 256 78 Q 256 90 256 100" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 282 84 Q 278 92 282 100" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tiny apron-pocket detail -->
  <rect x="174" y="362" width="40" height="26" rx="3"
        fill="white" stroke="black" stroke-width="3"/>
  <line x1="174" y1="370" x2="214" y2="370" stroke="black" stroke-width="1.5"/>

  <!-- Tiny stubby arms on sides -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Curved smile -->
  <path d="M 240 312 Q 256 328 272 312"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Cute oval blush with hatch lines -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>

  <!-- Signature accessory: multiplication grid with X badge -->
  <rect x="226" y="402" width="60" height="44" rx="4"
        fill="white" stroke="black" stroke-width="3"/>
  <!-- Grid lines -->
  <line x1="246" y1="402" x2="246" y2="446" stroke="black" stroke-width="1.5"/>
  <line x1="266" y1="402" x2="266" y2="446" stroke="black" stroke-width="1.5"/>
  <line x1="226" y1="416" x2="286" y2="416" stroke="black" stroke-width="1.5"/>
  <line x1="226" y1="430" x2="286" y2="430" stroke="black" stroke-width="1.5"/>
  <!-- Big multiplication X centered on grid -->
  <line x1="240" y1="412" x2="272" y2="436" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="272" y1="412" x2="240" y2="436" stroke="black" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
