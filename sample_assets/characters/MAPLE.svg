<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 5-point maple leaf topper on head -->
  <path d="M 256 60 L 268 86 L 296 78 L 286 104 L 312 110 L 290 124 L 300 142 L 272 138 L 268 158 L 256 142 L 244 158 L 240 138 L 212 142 L 222 124 L 200 110 L 226 104 L 216 78 L 244 86 Z"
        fill="white" stroke="black" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Leaf stem -->
  <line x1="256" y1="142" x2="256" y2="160" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tree-bark lines etched into egg-body sides -->
  <path d="M 110 270 Q 116 290 110 310" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 124 250 Q 130 280 124 320" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 402 270 Q 396 290 402 310" fill="none" stroke="black" stroke-width="1.5"/>
  <path d="M 388 250 Q 382 280 388 320" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Tiny stubby arms on sides -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Soft smile -->
  <path d="M 240 314 Q 256 328 272 314"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Cute oval blush with hatch lines -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>

  <!-- Signature: sap bucket with drops -->
  <path d="M 230 400 L 282 400 L 276 444 L 236 444 Z"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bucket handle -->
  <path d="M 234 400 Q 256 388 278 400" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Bucket band -->
  <line x1="232" y1="412" x2="280" y2="412" stroke="black" stroke-width="2"/>
  <!-- Sap drops above bucket -->
  <path d="M 252 388 Q 250 394 254 396 Q 256 394 254 388 Z" fill="black"/>
  <path d="M 264 392 Q 262 398 266 400 Q 268 398 266 392 Z" fill="black"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
