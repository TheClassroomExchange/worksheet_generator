<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Beaver ear-tufts (Canadian nickel motif) -->
  <ellipse cx="208" cy="108" rx="18" ry="14"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="208" cy="108" rx="8" ry="6"
           fill="white" stroke="black" stroke-width="2"/>
  <ellipse cx="304" cy="108" rx="18" ry="14"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="304" cy="108" rx="8" ry="6"
           fill="white" stroke="black" stroke-width="2"/>
  <!-- Small "5¢" plaque between ears -->
  <rect x="240" y="92" width="32" height="20" rx="3"
        fill="white" stroke="black" stroke-width="2.5"/>
  <text x="256" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">5¢</text>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tiny stubby arms -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Beaver-toothy smile -->
  <path d="M 236 312 Q 256 332 276 312"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <rect x="250" y="320" width="5" height="10" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="257" y="320" width="5" height="10" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- Cute oval blush -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>

  <!-- Signature: circle with "5¢" inside on body, with beaver silhouette below -->
  <circle cx="256" cy="402" r="32"
          fill="white" stroke="black" stroke-width="3"/>
  <text x="256" y="412" font-family="Arial, sans-serif" font-size="26" font-weight="bold"
        text-anchor="middle" fill="black">5¢</text>
  <!-- Tiny beaver silhouette accent -->
  <path d="M 238 446 Q 244 440 256 442 Q 270 440 276 446 L 282 452 Q 270 456 256 456 Q 242 456 230 452 Z"
        fill="white" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="244" cy="448" r="1.5" fill="black"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 462 Q 215 480 230 480 Q 244 480 244 464"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 464 Q 268 480 282 480 Q 297 480 294 462"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
