<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Two froggy eye-bumps on top -->
  <ellipse cx="216" cy="118" rx="22" ry="20"
           fill="white" stroke="black" stroke-width="4"/>
  <circle cx="216" cy="120" r="6" fill="black"/>
  <circle cx="219" cy="116" r="2" fill="white"/>
  <ellipse cx="296" cy="118" rx="22" ry="20"
           fill="white" stroke="black" stroke-width="4"/>
  <circle cx="296" cy="120" r="6" fill="black"/>
  <circle cx="299" cy="116" r="2" fill="white"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tiny stubby arms on sides -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Wide froggy smile -->
  <path d="M 220 314 Q 256 338 292 314"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Cute oval blush -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>

  <!-- Signature: "$2" toonie coin (two-tone ring inner+outer) -->
  <circle cx="256" cy="410" r="38"
          fill="white" stroke="black" stroke-width="3"/>
  <circle cx="256" cy="410" r="22"
          fill="white" stroke="black" stroke-width="2.5"/>
  <text x="256" y="421" font-family="Arial, sans-serif" font-size="22"
        font-weight="bold" text-anchor="middle" fill="black">$2</text>

  <!-- Webbed-foot feet (replacing stubby feet) -->
  <path d="M 200 458 Q 196 482 214 482 Q 222 478 226 482 Q 234 482 240 478 Q 246 482 252 478 L 252 458 Z"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <line x1="220" y1="478" x2="220" y2="468" stroke="black" stroke-width="1.5"/>
  <line x1="234" y1="478" x2="234" y2="466" stroke="black" stroke-width="1.5"/>
  <path d="M 260 458 L 260 478 Q 266 482 272 478 Q 278 482 286 478 Q 290 482 298 482 Q 316 482 312 458 Z"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <line x1="278" y1="478" x2="278" y2="466" stroke="black" stroke-width="1.5"/>
  <line x1="292" y1="478" x2="292" y2="468" stroke="black" stroke-width="1.5"/>
</svg>
