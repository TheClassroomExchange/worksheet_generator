<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Triangular cat ears: left upright, right flopping -->
  <path d="M 180 130 L 200 70 L 224 122 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 188 108 L 200 84 L 214 110"
        fill="none" stroke="black" stroke-width="2"/>
  <!-- Right ear, flopping over -->
  <path d="M 288 122 L 320 78 L 336 120 Q 322 132 304 128 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Curvy tail behind body -->
  <path d="M 408 360 Q 448 340 442 296 Q 436 270 420 274"
        fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny stubby arms -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Tiny cat nose + uncertain mouth -->
  <path d="M 250 308 L 256 314 L 262 308 Z"
        fill="black" stroke="black" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 240 326 Q 248 320 256 326 Q 264 332 272 326"
        fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Question-mark whisker on left cheek -->
  <path d="M 168 320 Q 178 314 184 322 Q 188 332 178 332"
        fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <circle cx="178" cy="340" r="1.5" fill="black"/>
  <!-- Plain whiskers right cheek -->
  <line x1="324" y1="318" x2="346" y2="314" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="324" y1="328" x2="346" y2="328" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- Cute oval blush -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>

  <!-- Signature: ? in a circle on body -->
  <circle cx="256" cy="410" r="32"
          fill="white" stroke="black" stroke-width="3"/>
  <path d="M 244 400 Q 244 386 256 386 Q 268 386 268 398 Q 268 408 256 412 L 256 420"
        fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="430" r="2.5" fill="black"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
