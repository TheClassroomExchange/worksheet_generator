<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tiny veterinary cap with band -->
  <path d="M 216 110 Q 256 76 296 110 L 294 122 L 218 122 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <rect x="218" y="118" width="76" height="10" rx="2"
        fill="white" stroke="black" stroke-width="3"/>
  <!-- Heart cross emblem on cap -->
  <path d="M 256 96 C 250 90, 240 96, 244 104 C 248 110, 256 116, 256 116 C 256 116, 264 110, 268 104 C 272 96, 262 90, 256 96 Z"
        fill="white" stroke="black" stroke-width="2"/>
  <line x1="256" y1="98" x2="256" y2="110" stroke="black" stroke-width="2"/>
  <line x1="250" y1="104" x2="262" y2="104" stroke="black" stroke-width="2"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tiny stubby arms -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Curved smile -->
  <path d="M 240 312 Q 256 326 272 312"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Blush ovals with hatch lines -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>
  <!-- Tiny extra heart on right cheek -->
  <path d="M 380 278 C 376 274, 370 278, 372 284 C 374 288, 380 292, 380 292 C 380 292, 386 288, 388 284 C 390 278, 384 274, 380 278 Z"
        fill="black"/>

  <!-- Signature: x = ? puzzle plaque -->
  <rect x="208" y="400" width="96" height="48" rx="6"
        fill="white" stroke="black" stroke-width="3"/>
  <text x="222" y="436" font-family="Helvetica, Arial, sans-serif" font-size="28" font-style="italic" font-weight="bold" fill="black">x = ?</text>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
