<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round mouse ears on top -->
  <circle cx="190" cy="118" r="34" fill="white" stroke="black" stroke-width="4"/>
  <circle cx="322" cy="118" r="34" fill="white" stroke="black" stroke-width="4"/>
  <circle cx="190" cy="118" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <circle cx="322" cy="118" r="18" fill="none" stroke="black" stroke-width="2.5"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Long thin tail at side -->
  <path d="M 414 360 Q 460 380 458 420 Q 456 452 432 452"
        fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny stubby arms on sides -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Tiny mouse smile -->
  <path d="M 244 314 Q 256 322 268 314"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Whiskers on cheeks -->
  <line x1="170" y1="305" x2="138" y2="300" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="312" x2="136" y2="316" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="342" y1="305" x2="374" y2="300" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="342" y1="312" x2="376" y2="316" stroke="black" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cute oval blush -->
  <ellipse cx="158" cy="298" rx="14" ry="8" fill="none" stroke="black" stroke-width="2"/>
  <line x1="148" y1="298" x2="168" y2="298" stroke="black" stroke-width="1.5"/>
  <ellipse cx="354" cy="298" rx="14" ry="8" fill="none" stroke="black" stroke-width="2"/>
  <line x1="344" y1="298" x2="364" y2="298" stroke="black" stroke-width="1.5"/>

  <!-- Signature accessory: cheese wedge with holes -->
  <path d="M 226 408 L 286 408 L 296 442 L 216 442 Z"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <line x1="226" y1="408" x2="216" y2="442" stroke="black" stroke-width="2"/>
  <circle cx="240" cy="424" r="4" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="262" cy="430" r="3" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="278" cy="420" r="3" fill="white" stroke="black" stroke-width="2"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
