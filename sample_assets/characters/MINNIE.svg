<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Round mouse ears -->
  <circle cx="200" cy="100" r="28"
          fill="white" stroke="black" stroke-width="4"/>
  <circle cx="200" cy="100" r="16"
          fill="white" stroke="black" stroke-width="2"/>
  <circle cx="312" cy="100" r="28"
          fill="white" stroke="black" stroke-width="4"/>
  <circle cx="312" cy="100" r="16"
          fill="white" stroke="black" stroke-width="2"/>

  <!-- Unified egg-shaped body (slightly petite — same dims for consistency) -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Long thin curling tail -->
  <path d="M 412 380 Q 460 380 460 330 Q 460 296 432 296"
        fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>

  <!-- Tiny stubby arms -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Tiny mouse nose -->
  <ellipse cx="256" cy="312" rx="8" ry="6" fill="black"/>

  <!-- Whiskers -->
  <line x1="220" y1="322" x2="186" y2="316" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="220" y1="330" x2="184" y2="332" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="292" y1="322" x2="326" y2="316" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="292" y1="330" x2="328" y2="332" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 246 332 Q 256 342 266 332"
        fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cute oval blush -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>

  <!-- Signature: − in a circle on body -->
  <circle cx="256" cy="410" r="32"
          fill="white" stroke="black" stroke-width="3"/>
  <line x1="238" y1="410" x2="274" y2="410" stroke="black" stroke-width="5" stroke-linecap="round"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
