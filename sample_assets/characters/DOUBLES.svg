<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- TWO antennae mirrored on head -->
  <line x1="220" y1="108" x2="220" y2="78" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="72" r="6" fill="white" stroke="black" stroke-width="3"/>
  <line x1="292" y1="108" x2="292" y2="78" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <circle cx="292" cy="72" r="6" fill="white" stroke="black" stroke-width="3"/>

  <!-- Unified egg-shaped body (head + body together, kawaii style) -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tiny stubby arms on sides -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes (filled black ovals) -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Eye sparkle highlights -->
  <ellipse cx="224" cy="228" rx="10" ry="14" fill="white"/>
  <ellipse cx="304" cy="228" rx="10" ry="14" fill="white"/>
  <circle cx="208" cy="265" r="4" fill="white"/>
  <circle cx="288" cy="265" r="4" fill="white"/>

  <!-- Rectangular robot mouth shape -->
  <rect x="238" y="314" width="36" height="12" rx="2"
        fill="white" stroke="black" stroke-width="3"/>
  <line x1="250" y1="314" x2="250" y2="326" stroke="black" stroke-width="1.5"/>
  <line x1="262" y1="314" x2="262" y2="326" stroke="black" stroke-width="1.5"/>

  <!-- Cute oval blush with hatch lines -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>

  <!-- Signature accessory: two identical small circles side-by-side (doubles motif) -->
  <circle cx="232" cy="425" r="22" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="280" cy="425" r="22" fill="white" stroke="black" stroke-width="3"/>
  <!-- Equal sign / labels showing identicality -->
  <text x="232" y="432" font-family="sans-serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="black">2</text>
  <text x="280" y="432" font-family="sans-serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="black">2</text>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
