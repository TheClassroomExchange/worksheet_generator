<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sloth fur-tuft on top -->
  <path d="M 236 110 Q 240 80 256 92 Q 272 80 276 110 Z"
        fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <line x1="248" y1="100" x2="248" y2="110" stroke="black" stroke-width="1.5"/>
  <line x1="256" y1="96" x2="256" y2="110" stroke="black" stroke-width="1.5"/>
  <line x1="264" y1="100" x2="264" y2="110" stroke="black" stroke-width="1.5"/>

  <!-- Unified egg-shaped body -->
  <ellipse cx="256" cy="285" rx="160" ry="180"
           fill="white" stroke="black" stroke-width="5"/>

  <!-- Tiny stubby arms on sides -->
  <ellipse cx="112" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="400" cy="310" rx="20" ry="44"
           fill="white" stroke="black" stroke-width="4"/>

  <!-- Big kawaii eyes (relaxed, smaller sparkle) -->
  <ellipse cx="216" cy="245" rx="32" ry="42" fill="black"/>
  <ellipse cx="296" cy="245" rx="32" ry="42" fill="black"/>

  <!-- Sloth dark eye-mask hint (curved line under eyes) -->
  <path d="M 188 270 Q 216 285 244 270" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 268 270 Q 296 285 324 270" fill="none" stroke="black" stroke-width="2"/>

  <!-- Smaller sparkle highlights for relaxed look -->
  <ellipse cx="222" cy="232" rx="6" ry="9" fill="white"/>
  <ellipse cx="302" cy="232" rx="6" ry="9" fill="white"/>
  <circle cx="210" cy="260" r="3" fill="white"/>
  <circle cx="290" cy="260" r="3" fill="white"/>

  <!-- Soft sleepy smile -->
  <path d="M 240 318 Q 256 328 272 318"
        fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>

  <!-- Cute oval blush with hatch lines -->
  <ellipse cx="148" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="138" y1="298" x2="158" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="146" y1="293" x2="150" y2="303" stroke="black" stroke-width="1.5"/>
  <ellipse cx="364" cy="298" rx="16" ry="9" fill="none" stroke="black" stroke-width="2"/>
  <line x1="354" y1="298" x2="374" y2="298" stroke="black" stroke-width="1.5"/>
  <line x1="362" y1="293" x2="366" y2="303" stroke="black" stroke-width="1.5"/>

  <!-- Signature: a simple LEAF on body -->
  <path d="M 256 365 Q 220 385 230 430 Q 270 440 290 410 Q 300 380 256 365 Z"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Leaf vein -->
  <path d="M 240 425 Q 260 400 286 380"
        fill="none" stroke="black" stroke-width="2"/>
  <line x1="252" y1="412" x2="262" y2="404" stroke="black" stroke-width="1.5"/>
  <line x1="262" y1="402" x2="270" y2="395" stroke="black" stroke-width="1.5"/>
  <line x1="272" y1="392" x2="280" y2="386" stroke="black" stroke-width="1.5"/>

  <!-- Stubby rounded feet -->
  <path d="M 218 458 Q 215 478 230 478 Q 244 478 244 460"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 268 460 Q 268 478 282 478 Q 297 478 294 458"
        fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
</svg>
