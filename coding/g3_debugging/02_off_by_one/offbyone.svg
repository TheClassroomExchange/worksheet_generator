<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: off-by-one in a turtle square. range(3) = one side missing (open);
     range(4) = closed. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <marker id="o1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#486581"/>
    </marker>
  </defs>
  <!-- open (range 3) -->
  <polyline points="35,30 95,30 95,90 35,90" fill="none" stroke="#F5A623" stroke-width="3.5"/>
  <circle cx="118" cy="34" r="11" fill="#fff" stroke="#E04848" stroke-width="3"/>
  <text x="118" y="39" text-anchor="middle" font-family="Arial" font-size="13" fill="#E04848" font-weight="bold">✗</text>
  <text x="65" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#E04848" font-weight="bold">range(3): a side missing</text>
  <!-- arrow -->
  <line x1="140" y1="60" x2="186" y2="60" stroke="#486581" stroke-width="3" marker-end="url(#o1)"/>
  <text x="163" y="50" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">+1</text>
  <!-- closed (range 4) -->
  <polygon points="215,30 275,30 275,90 215,90" fill="none" stroke="#3FB66E" stroke-width="3.5"/>
  <circle cx="298" cy="34" r="11" fill="#fff" stroke="#2BB293" stroke-width="3"/>
  <text x="298" y="39" text-anchor="middle" font-family="Arial" font-size="12" fill="#2BB293" font-weight="bold">✓</text>
  <text x="245" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#2BB293" font-weight="bold">range(4): closed</text>
</svg>
