<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: read a loop, predict the drawing. Two traced examples: a square
     (with a turn) and a straight line (no turn). Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- square example -->
  <polygon points="40,30 95,30 95,85 40,85" fill="none" stroke="#39C9A6" stroke-width="3.5"/>
  <text x="67" y="105" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#243B53">with a turn</text>
  <text x="67" y="118" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">→ a shape</text>

  <!-- arrow / divider -->
  <line x1="135" y1="20" x2="135" y2="95" stroke="#D9E2EC" stroke-width="2"/>

  <!-- straight line example -->
  <line x1="175" y1="58" x2="290" y2="58" fill="none" stroke="#39C9A6" stroke-width="3.5"/>
  <circle cx="175" cy="58" r="4" fill="#FFC857"/>
  <text x="232" y="105" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#243B53">no turn</text>
  <text x="232" y="118" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">→ a straight line</text>

  <text x="160" y="14" text-anchor="middle" font-family="Arial" font-size="11" fill="#2BB293" font-weight="bold">read the loop → picture what Bit draws</text>
</svg>
