<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: for step in range(3): forward(50); right(90) — 3 sides + 3 turns,
     an open path (one more side would close a square). Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170">
  <defs>
    <marker id="t2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#39C9A6"/>
    </marker>
  </defs>
  <!-- 3 sides: across, down, back (open) -->
  <line x1="80" y1="40" x2="210" y2="40" stroke="#39C9A6" stroke-width="4" marker-end="url(#t2)"/>
  <line x1="210" y1="40" x2="210" y2="140" stroke="#39C9A6" stroke-width="4" marker-end="url(#t2)"/>
  <line x1="210" y1="140" x2="80" y2="140" stroke="#39C9A6" stroke-width="4" marker-end="url(#t2)"/>
  <!-- turn dots -->
  <circle cx="210" cy="40" r="5" fill="#FFC857"/>
  <circle cx="210" cy="140" r="5" fill="#FFC857"/>
  <text x="224" y="92" font-family="Arial" font-size="11" fill="#486581">right 90</text>
  <text x="145" y="32" text-anchor="middle" font-family="Arial" font-size="11" fill="#486581">forward 50</text>
  <!-- Bit at start -->
  <g transform="translate(80,40)">
    <circle r="13" fill="#6FE3C4" stroke="#2BB293" stroke-width="3"/>
    <rect x="-9" y="-6" width="18" height="12" rx="5" fill="#102A43"/>
    <circle cx="-4" cy="-1" r="2" fill="#7FFBE4"/><circle cx="4" cy="-1" r="2" fill="#7FFBE4"/>
  </g>
</svg>
