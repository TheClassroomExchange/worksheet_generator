<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: for i in range(4): forward(50); right(90) → a closed square.
     Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <defs>
    <marker id="t3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#39C9A6"/>
    </marker>
  </defs>
  <!-- square sides w/ direction arrows -->
  <line x1="60" y1="150" x2="160" y2="150" stroke="#39C9A6" stroke-width="4" marker-end="url(#t3)"/>
  <line x1="160" y1="150" x2="160" y2="50" stroke="#39C9A6" stroke-width="4" marker-end="url(#t3)"/>
  <line x1="160" y1="50" x2="60" y2="50" stroke="#39C9A6" stroke-width="4" marker-end="url(#t3)"/>
  <line x1="60" y1="50" x2="60" y2="150" stroke="#39C9A6" stroke-width="4" marker-end="url(#t3)"/>
  <circle cx="160" cy="150" r="4.5" fill="#FFC857"/><circle cx="160" cy="50" r="4.5" fill="#FFC857"/>
  <circle cx="60" cy="50" r="4.5" fill="#FFC857"/>
  <text x="110" y="172" text-anchor="middle" font-family="Arial" font-size="11" fill="#486581">forward 50</text>
  <text x="170" y="104" font-family="Arial" font-size="11" fill="#486581">right 90</text>
  <!-- Bit at start corner -->
  <g transform="translate(60,150)">
    <circle r="13" fill="#6FE3C4" stroke="#2BB293" stroke-width="3"/>
    <rect x="-9" y="-6" width="18" height="12" rx="5" fill="#102A43"/>
    <circle cx="-4" cy="-1" r="2" fill="#7FFBE4"/><circle cx="4" cy="-1" r="2" fill="#7FFBE4"/>
  </g>
  <text x="110" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="#2BB293" font-weight="bold">range(4) → a square</text>
</svg>
