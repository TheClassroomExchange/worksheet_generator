<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: for step in range(3): bit.forward(20) — Bit moves forward in 3
     equal hops of 20 along a line. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110">
  <defs>
    <marker id="t1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#39C9A6"/>
    </marker>
  </defs>

  <!-- start dot -->
  <circle cx="40" cy="70" r="5" fill="#FFC857"/>
  <text x="40" y="92" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">start</text>

  <!-- 3 hops of 20 -->
  <g stroke="#39C9A6" stroke-width="4" marker-end="url(#t1)">
    <line x1="44" y1="70" x2="128" y2="70"/>
    <line x1="132" y1="70" x2="216" y2="70"/>
    <line x1="220" y1="70" x2="304" y2="70"/>
  </g>
  <g font-family="Arial" font-size="11" fill="#486581" text-anchor="middle">
    <text x="88" y="58">forward 20</text>
    <text x="176" y="58">forward 20</text>
    <text x="264" y="58">forward 20</text>
  </g>
  <text x="180" y="106" text-anchor="middle" font-family="Arial" font-size="12" fill="#2BB293" font-weight="bold">range(3) → 3 hops → 60 steps</text>

  <!-- Bit at the end -->
  <g transform="translate(322,70)">
    <rect x="-15" y="-15" width="30" height="30" rx="9" fill="#6FE3C4" stroke="#2BB293" stroke-width="2"/>
    <rect x="-10" y="-7" width="20" height="13" rx="5" fill="#102A43"/>
    <circle cx="-4" cy="-1" r="2.2" fill="#7FFBE4"/><circle cx="4" cy="-1" r="2.2" fill="#7FFBE4"/>
  </g>
</svg>
