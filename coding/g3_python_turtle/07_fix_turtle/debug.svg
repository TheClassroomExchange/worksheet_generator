<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: debugging turtle code — the buggy range(3) is fixed to range(4) so
     the square closes. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
  <defs>
    <marker id="d8" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#486581"/>
    </marker>
  </defs>
  <!-- buggy: open 3-side path -->
  <polyline points="35,30 95,30 95,90 35,90" fill="none" stroke="#F5A623" stroke-width="3.5"/>
  <circle cx="118" cy="34" r="12" fill="#fff" stroke="#E04848" stroke-width="3"/>
  <text x="118" y="39" text-anchor="middle" font-family="Arial" font-size="14" fill="#E04848" font-weight="bold">✗</text>
  <text x="65" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#E04848" font-weight="bold">range(3) — open</text>

  <!-- arrow -->
  <line x1="140" y1="60" x2="188" y2="60" stroke="#486581" stroke-width="3" marker-end="url(#d8)"/>
  <text x="164" y="50" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">fix it</text>

  <!-- fixed: closed square -->
  <polygon points="215,30 275,30 275,90 215,90" fill="none" stroke="#3FB66E" stroke-width="3.5"/>
  <circle cx="298" cy="34" r="12" fill="#fff" stroke="#2BB293" stroke-width="3"/>
  <text x="298" y="39" text-anchor="middle" font-family="Arial" font-size="13" fill="#2BB293" font-weight="bold">✓</text>
  <text x="245" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#2BB293" font-weight="bold">range(4) — a square</text>
</svg>
