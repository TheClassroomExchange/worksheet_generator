<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: reading repeat 5 { move 10 } as 5 jumps of 10 along a number line
     to 50. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
  <defs>
    <marker id="j5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#39C9A6"/>
    </marker>
  </defs>

  <!-- number line -->
  <line x1="40" y1="80" x2="330" y2="80" stroke="#486581" stroke-width="2"/>
  <g font-family="Arial" font-size="11" fill="#486581" text-anchor="middle">
    <line x1="40" y1="75" x2="40" y2="85" stroke="#486581" stroke-width="2"/><text x="40" y="100">0</text>
    <line x1="98" y1="75" x2="98" y2="85" stroke="#486581" stroke-width="2"/><text x="98" y="100">10</text>
    <line x1="156" y1="75" x2="156" y2="85" stroke="#486581" stroke-width="2"/><text x="156" y="100">20</text>
    <line x1="214" y1="75" x2="214" y2="85" stroke="#486581" stroke-width="2"/><text x="214" y="100">30</text>
    <line x1="272" y1="75" x2="272" y2="85" stroke="#486581" stroke-width="2"/><text x="272" y="100">40</text>
    <line x1="330" y1="75" x2="330" y2="85" stroke="#486581" stroke-width="2"/><text x="330" y="100">50</text>
  </g>

  <!-- 5 jump arcs of 10 -->
  <g fill="none" stroke="#39C9A6" stroke-width="2.5">
    <path d="M40 78 Q69 50 98 78" marker-end="url(#j5)"/>
    <path d="M98 78 Q127 50 156 78" marker-end="url(#j5)"/>
    <path d="M156 78 Q185 50 214 78" marker-end="url(#j5)"/>
    <path d="M214 78 Q243 50 272 78" marker-end="url(#j5)"/>
    <path d="M272 78 Q301 50 330 78" marker-end="url(#j5)"/>
  </g>
  <text x="185" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="#2BB293" font-weight="bold">repeat 5 × move 10 = 50 steps</text>

  <!-- Bit at the end -->
  <g transform="translate(330,52)">
    <rect x="-14" y="-14" width="28" height="28" rx="9" fill="#6FE3C4" stroke="#2BB293" stroke-width="2"/>
    <rect x="-9" y="-7" width="18" height="12" rx="5" fill="#102A43"/>
    <circle cx="-4" cy="-1" r="2" fill="#7FFBE4"/><circle cx="4" cy="-1" r="2" fill="#7FFBE4"/>
  </g>
</svg>
