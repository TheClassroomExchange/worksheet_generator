<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: debugging a loop — the buggy repeat number (3) is fixed to the
     right one (5). Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" width="360" height="130">
  <defs>
    <marker id="d7" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#486581"/>
    </marker>
  </defs>

  <!-- buggy block -->
  <rect x="20" y="48" width="120" height="34" rx="9" fill="#F5A623" opacity="0.85"/>
  <text x="80" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">repeat 3</text>
  <circle cx="128" cy="56" r="13" fill="#fff" stroke="#E04848" stroke-width="3"/>
  <text x="128" y="61" text-anchor="middle" font-family="Arial" font-size="15" fill="#E04848" font-weight="bold">✗</text>
  <text x="80" y="38" text-anchor="middle" font-family="Arial" font-size="11" fill="#E04848" font-weight="bold">the bug</text>
  <text x="80" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">only 3 jumps</text>

  <!-- arrow: fix it -->
  <line x1="160" y1="65" x2="208" y2="65" stroke="#486581" stroke-width="3" marker-end="url(#d7)"/>
  <text x="184" y="54" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">fix it</text>

  <!-- fixed block -->
  <rect x="224" y="48" width="120" height="34" rx="9" fill="#3FB66E"/>
  <text x="284" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">repeat 5</text>
  <circle cx="332" cy="56" r="13" fill="#fff" stroke="#2BB293" stroke-width="3"/>
  <text x="332" y="61" text-anchor="middle" font-family="Arial" font-size="14" fill="#2BB293" font-weight="bold">✓</text>
  <text x="284" y="38" text-anchor="middle" font-family="Arial" font-size="11" fill="#2BB293" font-weight="bold">the fix</text>
  <text x="284" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">now 5 jumps</text>
</svg>
