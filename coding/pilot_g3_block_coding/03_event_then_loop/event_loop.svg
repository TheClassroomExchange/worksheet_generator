<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: an event starts a loop. Green-flag event block → arrow → repeat
     box with Bit. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="360" height="150">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#486581"/>
    </marker>
  </defs>

  <!-- event block -->
  <rect x="18" y="55" width="120" height="40" rx="9" fill="#F2A23C" stroke="#D98828" stroke-width="2"/>
  <polygon points="34,75 44,68 44,82" fill="#3FB66E"/>
  <text x="86" y="79" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">when flag clicked</text>
  <text x="78" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#D98828" font-weight="bold">the EVENT</text>

  <!-- arrow -->
  <line x1="142" y1="75" x2="184" y2="75" stroke="#486581" stroke-width="3" marker-end="url(#ar)"/>
  <text x="163" y="64" text-anchor="middle" font-family="Arial" font-size="10" fill="#486581">starts</text>

  <!-- repeat box -->
  <rect x="192" y="40" width="120" height="72" rx="10" fill="#FDF3E4" stroke="#F5A623" stroke-width="2.5"/>
  <rect x="200" y="48" width="104" height="20" rx="6" fill="#F5A623"/>
  <text x="252" y="62" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff" font-weight="bold">repeat 5</text>
  <rect x="212" y="76" width="84" height="16" rx="5" fill="#4C8BF5"/>
  <text x="254" y="88" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff">move 10</text>
  <text x="252" y="128" text-anchor="middle" font-family="Arial" font-size="11" fill="#486581" font-weight="bold">the LOOP repeats</text>

  <!-- Bit small, bottom-left -->
  <g transform="translate(78,120)">
    <rect x="-16" y="-16" width="32" height="32" rx="10" fill="#6FE3C4" stroke="#2BB293" stroke-width="2"/>
    <rect x="-10" y="-8" width="20" height="13" rx="5" fill="#102A43"/>
    <circle cx="-4" cy="-2" r="2.2" fill="#7FFBE4"/><circle cx="4" cy="-2" r="2.2" fill="#7FFBE4"/>
  </g>
</svg>
