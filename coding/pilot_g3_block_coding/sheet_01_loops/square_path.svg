<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagram: the square Bit draws with repeat 4 { move 10, turn 90 }.
     Original artwork. Shows the 4 sides + turn corners + Bit at the start. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#39C9A6"/>
    </marker>
  </defs>

  <!-- faint grid -->
  <g stroke="#E3ECF3" stroke-width="1">
    <line x1="70" y1="30" x2="70" y2="190"/><line x1="110" y1="30" x2="110" y2="190"/>
    <line x1="150" y1="30" x2="150" y2="190"/><line x1="190" y1="30" x2="190" y2="190"/>
    <line x1="230" y1="30" x2="230" y2="190"/>
    <line x1="70" y1="30" x2="230" y2="30"/><line x1="70" y1="70" x2="230" y2="70"/>
    <line x1="70" y1="110" x2="230" y2="110"/><line x1="70" y1="150" x2="230" y2="150"/>
    <line x1="70" y1="190" x2="230" y2="190"/>
  </g>

  <!-- the square path (4 sides, drawn with arrows showing direction) -->
  <line x1="90" y1="170" x2="210" y2="170" stroke="#39C9A6" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="210" y1="170" x2="210" y2="50" stroke="#39C9A6" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="210" y1="50" x2="90" y2="50" stroke="#39C9A6" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="90" y1="50" x2="90" y2="170" stroke="#39C9A6" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- corner dots (the 4 turns) -->
  <circle cx="210" cy="170" r="5" fill="#FFC857"/>
  <circle cx="210" cy="50" r="5" fill="#FFC857"/>
  <circle cx="90" cy="50" r="5" fill="#FFC857"/>

  <!-- side labels -->
  <text x="150" y="188" text-anchor="middle" font-family="Arial" font-size="12" fill="#486581">move 10</text>
  <text x="218" y="114" font-family="Arial" font-size="12" fill="#486581">turn 90</text>

  <!-- Bit at the start corner -->
  <circle cx="90" cy="170" r="13" fill="#6FE3C4" stroke="#2BB293" stroke-width="3"/>
  <circle cx="85" cy="168" r="2.6" fill="#102A43"/><circle cx="95" cy="168" r="2.6" fill="#102A43"/>
  <path d="M85 174 Q90 178 95 174" fill="none" stroke="#102A43" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#2BB293" font-weight="bold">Bit starts here</text>
</svg>
